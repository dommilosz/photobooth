display:
  width: 1024
  height: 600
  fullscreen: true
ui:
  virtual_keyboard: true
camera:
  device: 0
  fourcc: MJPG
  preview_size:
  - 480
  - 360
  preview_fps: 12
  still_size:
  - 1920
  - 1080
  mirror: true
capture:
  countdown_seconds: 1
  inter_photo_pause_ms: 500
layout:
  mode: strip_3_hb
  templates_dir: templates
flash:
  enabled: true
  # gpio | serial | mock
  backend: gpio
  # --- GPIO lamp (backend: gpio) ---
  gpio_pin: 17
  active_high: true
  # --- USB serial lamp (backend: serial) — commands: "D <power>\n" / "D 0\n" ---
  serial_port: /dev/ttyUSB0
  serial_baud: 115200
  power: 100
  off_power: 0
  warmup_ms: 100
  duration_ms: 3000
  safety_ms: 5000
print:
  dpi: 300
  gap_mm: 2
  cups_queue: Canon_SELPHY_CP1300
  fit_to_page: true
event_name: photobooth
upload:
  enabled: true
  share_url: ''
  password: ''
  retry_interval_sec: 300
settings_pin: '1234'
paths:
  data_dir: data
  prints_dir: data/prints
  sessions_dir: data/sessions
  upload_queue_dir: data/upload_queue
